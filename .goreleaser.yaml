version: 2

project_name: console-ir

before:
  hooks:
    - go mod download

builds:
  - id: console-ir
    main: ./main.go
    binary: console-ir
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.Version={{ .Version }} -X main.Commit={{ .ShortCommit }} -X main.BuildTime={{ .Date }}

archives:
  - id: console-ir
    ids:
      - console-ir
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "darwin" }}macOS{{ else if eq .Os "linux" }}Linux{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - config/llm_settings.sample.json
      - docs/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
    - title: Other Changes

brews:
  - name: console-ir
    repository:
      owner: Ashfaaq98
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    # The tap (Ashfaaq98/homebrew-tap) and HOMEBREW_TAP_TOKEN both exist now, so
    # the formula is published again. It had been pinned to "true" since before
    # the tap was created, which left Homebrew users on v0.1.0 while v0.1.1
    # shipped. "auto" still skips snapshots and prereleases.
    skip_upload: auto
    homepage: "https://github.com/Ashfaaq98/ocsf-console-ir"
    description: "Terminal-first OCSF-native incident response manager for security analysts"
    license: "AGPL-3.0-only"
    install: |
      bin.install "console-ir"
    test: |
      system "#{bin}/console-ir", "--version"

# Scoop is the low-friction Windows channel: the manifest is generated from the
# archives already built here and published to a bucket repo, so a Windows
# analyst gets `scoop install console-ir` rather than "download a zip and put it
# on your PATH". winget is the next one and is not here yet: it needs a manifest
# pull request into Microsoft's repository for every release, which is a release
# process rather than a config block.
scoops:
  - name: console-ir
    repository:
      owner: Ashfaaq98
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    # As with the Homebrew tap: auto skips snapshots and prereleases, so a
    # snapshot build never tries to push to the bucket.
    skip_upload: auto
    homepage: "https://github.com/Ashfaaq98/ocsf-console-ir"
    description: "Terminal-first OCSF-native incident response manager for security analysts"
    license: "AGPL-3.0-only"

release:
  github:
    owner: Ashfaaq98
    name: ocsf-console-ir
  name_template: "v{{ .Version }}"
  make_latest: "{{ not .Prerelease }}"
  prerelease: auto
  header: |
    ## Quick Install

    ### Homebrew

    ```bash
    brew install Ashfaaq98/tap/console-ir
    ```

    ### curl installer (Linux and macOS)

    ```bash
    curl -sSfL https://raw.githubusercontent.com/Ashfaaq98/ocsf-console-ir/main/scripts/install.sh | bash
    ```

    ### Scoop (Windows)

    ```pwsh
    scoop bucket add ashfaaq98 https://github.com/Ashfaaq98/scoop-bucket
    scoop install console-ir
    ```
  footer: |
    **Full Changelog**: https://github.com/Ashfaaq98/ocsf-console-ir/compare/{{ .PreviousTag }}...{{ .Tag }}

snapshot:
  version_template: "{{ incpatch .Version }}-next"
