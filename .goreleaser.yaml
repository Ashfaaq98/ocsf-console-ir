version: 2

project_name: console-ir

before:
  hooks:
    - go mod download

builds:
  - id: console-ir
    main: ./main.go
    binary: console-ir
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.Version={{ .Version }} -X main.Commit={{ .ShortCommit }} -X main.BuildTime={{ .Date }}

archives:
  - id: console-ir
    ids:
      - console-ir
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "darwin" }}macOS{{ else if eq .Os "linux" }}Linux{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - config/llm_settings.sample.json
      - docs/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
    - title: Other Changes

# Homebrew, as a cask rather than a formula.
#
# GoReleaser deprecated `brews:` in favour of `homebrew_casks:`, and `goreleaser
# check` failed on every run until this moved. The change is not a rename:
# Homebrew Cask is a macOS mechanism, and casks in the main tap carry
# `Required: macOS`. GoReleaser does emit `on_linux` stanzas, so a Linux
# Homebrew may tolerate it — but that is not a path this project tests or
# recommends. Linux users get the curl installer or an archive, and the README,
# the docs and the release header all say `--cask` with the platform beside it
# rather than offering `brew install` bare.
homebrew_casks:
  - name: console-ir
    repository:
      owner: Ashfaaq98
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    # The tap and HOMEBREW_TAP_TOKEN both exist, so this publishes. It had been
    # pinned to "true" before the tap was created, which left Homebrew users on
    # v0.1.0 while v0.1.1 shipped. "auto" still skips snapshots and prereleases.
    skip_upload: auto
    homepage: "https://github.com/Ashfaaq98/ocsf-console-ir"
    description: "Terminal-first OCSF-native incident response manager for security analysts"
    license: "AGPL-3.0-only"
    hooks:
      post:
        # macOS quarantines anything downloaded without a notarised signature,
        # and refuses to run it with a dialog that says the binary is damaged
        # rather than that it is unsigned. Stripping the attribute on install is
        # what every unsigned cask does; signing and notarising is the real fix
        # and needs an Apple developer account.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/console-ir"]
          end


# Scoop is the low-friction Windows channel: the manifest is generated from the
# archives already built here and published to a bucket repo, so a Windows
# analyst gets `scoop install console-ir` rather than "download a zip and put it
# on your PATH". winget is the next one and is not here yet: it needs a manifest
# pull request into Microsoft's repository for every release, which is a release
# process rather than a config block.
scoops:
  - name: console-ir
    repository:
      owner: Ashfaaq98
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    # As with the Homebrew tap: auto skips snapshots and prereleases, so a
    # snapshot build never tries to push to the bucket.
    skip_upload: auto
    homepage: "https://github.com/Ashfaaq98/ocsf-console-ir"
    description: "Terminal-first OCSF-native incident response manager for security analysts"
    license: "AGPL-3.0-only"

release:
  github:
    owner: Ashfaaq98
    name: ocsf-console-ir
  name_template: "v{{ .Version }}"
  make_latest: "{{ not .Prerelease }}"
  prerelease: auto
  header: |
    ## Quick Install

    ### Homebrew (macOS)

    ```bash
    brew install --cask Ashfaaq98/tap/console-ir
    ```

    ### curl installer (Linux and macOS)

    ```bash
    curl -sSfL https://raw.githubusercontent.com/Ashfaaq98/ocsf-console-ir/main/scripts/install.sh | bash
    ```

    ### Scoop (Windows)

    ```pwsh
    scoop bucket add ashfaaq98 https://github.com/Ashfaaq98/scoop-bucket
    scoop install console-ir
    ```
  footer: |
    **Full Changelog**: https://github.com/Ashfaaq98/ocsf-console-ir/compare/{{ .PreviousTag }}...{{ .Tag }}

snapshot:
  version_template: "{{ incpatch .Version }}-next"
